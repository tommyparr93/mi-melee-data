<div class="modal fade show" id="addPlayerModal" tabindex="-1" style="display: block; background: rgba(0,0,0,0.5);" aria-modal="true" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content shadow-lg border-0">

            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    <i class="fas fa-user-plus me-2"></i>Add Player to {{ season.name }}
                </h5>
                <button type="button" class="btn-close btn-close-white" onclick="document.getElementById('modal-container').innerHTML=''"></button>
            </div>

            <form hx-post="{% url 'add_player_to_season' season.id %}" hx-target="#modal-container">
                {% csrf_token %}

                <div class="modal-body">
                    <p class="text-muted small mb-4">Search for an eligible player and assign them a rank for this season.</p>

                    <div class="mb-3">
                        <label for="player_name_input" class="form-label fw-bold">Player Tag</label>
                        <input type="text"
                               id="player_name_input"
                               name="player_name"
                               list="player-datalist"
                               class="form-control {% if form.player_name.errors %}is-invalid{% endif %}"
                               placeholder="Start typing tag (e.g. Mango)..."
                               autocomplete="off"
                               required>

                        <datalist id="player-datalist">
                            {% for p in all_players %}
                                <option value="{{ p.name }}">
                            {% endfor %}
                        </datalist>

                        {% if form.player_name.errors %}
                            <div class="invalid-feedback d-block">
                                {{ form.player_name.errors.0 }}
                            </div>
                        {% endif %}
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.rank.id_for_label }}" class="form-label fw-bold">Assigned Rank</label>
                        <div class="input-group">
                            <span class="input-group-text">#</span>
                            <input type="number"
                                   name="rank"
                                   class="form-control {% if form.rank.errors %}is-invalid{% endif %}"
                                   placeholder="1"
                                   min="1"
                                   required>
                        </div>
                        {% if form.rank.errors %}
                            <div class="invalid-feedback d-block">
                                {{ form.rank.errors.0 }}
                            </div>
                        {% endif %}
                    </div>
                </div>

                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary" onclick="document.getElementById('modal-container').innerHTML=''">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-success px-4">
                        Add to PR List
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('player_name_input').focus();
</script>
