<div class="modal fade show" id="addPlayerModal" tabindex="-1" style="display: block; background: rgba(0,0,0,0.5);" aria-modal="true" role="dialog">
    <div class="modal-dialog">
        <div class="modal-content shadow-lg border-0">

            <div class="modal-header bg-success text-white">
                <h5 class="modal-title">
                    <i class="fas fa-user-plus me-2"></i>Add Player to {{ season.name }}
                </h5>
                <button type="button" class="btn-close btn-close-white" onclick="document.getElementById('modal-container').innerHTML=''"></button>
            </div>

            <form hx-post="{% url 'add_player_to_season' season.id %}"
                  hx-target="#modal-container" hx-swap="innerHTML">
                {% csrf_token %}

                <div class="modal-body">
                    {% if error %}
                        <div class="alert alert-danger py-2 small">{{ error }}</div>
                    {% endif %}

                    <p class="text-muted small mb-3">Search for a player, click to select them, then assign a rank.</p>

                    <div class="mb-2">
                        <label for="pr-player-search" class="form-label fw-bold">Player</label>
                        <input type="text" id="pr-player-search" class="form-control"
                               placeholder="Type at least 2 letters of a tag..."
                               autocomplete="off"
                               hx-get="{% url 'pr_player_search' %}"
                               hx-trigger="keyup changed delay:250ms"
                               hx-target="#pr-search-results"
                               name="q">
                        <div id="pr-search-results" class="list-group mt-1"
                             style="max-height:220px; overflow-y:auto;"></div>
                    </div>

                    <div id="pr-selected" class="alert alert-light border py-2 small mb-3 d-none">
                        Selected: <strong id="pr-selected-name"></strong>
                    </div>
                    <input type="hidden" name="player_id" id="pr-player-id">

                    <div class="mb-1">
                        <label for="pr-rank-input" class="form-label fw-bold">Assigned Rank</label>
                        <input type="text" name="rank" id="pr-rank-input"
                               class="form-control" maxlength="3"
                               placeholder="1  (or a text rank like IM / HM)"
                               autocomplete="off" required>
                        <div class="form-text">Numbers sort first (1, 2 … 10), then text ranks.</div>
                    </div>
                </div>

                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary" onclick="document.getElementById('modal-container').innerHTML=''">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-success px-4" id="pr-add-submit" disabled>
                        Add to PR List
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    (function () {
        var search = document.getElementById('pr-player-search');
        if (search) { search.focus(); }
    })();

    function selectPRPlayer(id, name) {
        document.getElementById('pr-player-id').value = id;
        document.getElementById('pr-selected-name').textContent = name;
        document.getElementById('pr-selected').classList.remove('d-none');
        document.getElementById('pr-search-results').innerHTML = '';
        document.getElementById('pr-player-search').value = name;
        document.getElementById('pr-add-submit').disabled = false;
    }
</script>
