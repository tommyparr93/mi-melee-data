{% extends 'base.html' %}
{% block content %}
<style>
    @keyframes prRowSaved {
        0%   { background-color: #d1e7dd; }
        100% { background-color: transparent; }
    }
    .pr-row-saved td { animation: prRowSaved 1.4s ease-out; }
</style>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-md-3">
            <div class="list-group shadow-sm">
                <div class="list-group-item bg-dark text-white fw-bold">Management Tools</div>
                <a href="{% url 'pr_season_list' %}" class="list-group-item list-group-item-action">
                    <i class="fas fa-chevron-left"></i> Back to All Seasons
                </a>
                <button class="list-group-item list-group-item-action"
                        hx-get="{% url 'pr_season_edit' season.pk %}" hx-target="#modal-container">
                    <i class="fas fa-cog"></i> Edit Season Details
                </button>
                <button class="list-group-item list-group-item-action text-success" 
                        hx-get="{% url 'add_player_to_season' season.id %}" hx-target="#modal-container">
                    <i class="fas fa-plus-circle"></i> Add Player to PR
                </button>
            </div>
        </div>

        <div class="col-md-9">
            <div class="card border-primary shadow">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Editing: {{ season.name }}</h4>
                    <span class="badge bg-light text-dark">{{ season.region_code.name }}</span>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th class="ps-4" style="width: 100px;">Rank</th>
                                <th>Player Tag</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        {% include 'main/admin/partials/pr_ranked_tbody.html' %}
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="modal-container"></div>
{% endblock %}
