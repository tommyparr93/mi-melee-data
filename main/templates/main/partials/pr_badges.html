{% for badge in badges %}<span class="badge ml-1" title="{{ badge.title }}{% if not badge.current %} (not on the latest list){% endif %}" style="font-size: 0.7rem; font-weight: 600; vertical-align: middle; border: 1px solid {% if badge.is_michigan %}#0d6efd{% else %}#6f42c1{% endif %}; {% if badge.current %}color: #fff; background-color: {% if badge.is_michigan %}#0d6efd{% else %}#6f42c1{% endif %};{% else %}color: {% if badge.is_michigan %}#0d6efd{% else %}#6f42c1{% endif %}; background-color: transparent;{% endif %}">{{ badge.text }}</span>{% endfor %}
