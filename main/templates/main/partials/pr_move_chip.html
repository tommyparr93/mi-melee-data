{% if e.move %}{% if e.move.kind == 'up' %}<span class="pr-move pr-move-up" title="Up {{ e.move.value }} from last season">&#9650; {{ e.move.value }}</span>{% elif e.move.kind == 'down' %}<span class="pr-move pr-move-down" title="Down {{ e.move.value }} from last season">&#9660; {{ e.move.value }}</span>{% elif e.move.kind == 'same' %}<span class="pr-move pr-move-same" title="Same rank as last season">&ndash;</span>{% elif e.move.kind == 'new' %}<span class="pr-move pr-move-new" title="Not in last season's rankings">NEW</span>{% else %}<span class="pr-move pr-move-from">{{ e.move.label }}</span>{% endif %}{% endif %}
